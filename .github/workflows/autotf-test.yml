name: Terraform

# Se activa únicamente ante un Pull Request dirigido a la rama 'main'
on:
  push:
    branches:
      - leosepulveda
  workflow_dispatch:

jobs:
  # 1. Análisis Estático con TFLint
  static_analysis:
    name: Análisis Estático (TFLint)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Inicializar TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Ejecutar Análisis Estático
        run: tflint -f compact
        
  # 2. Análisis de Seguridad con Checkov
  security_analysis:
    name: Análisis de Seguridad (Checkov)
    needs: static_analysis 
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: . 
          framework: terraform 
          soft_fail: false 
          
  # 3. Validación de Terraform
  terraform_validation:
    name: Validación Terraform
    needs: security_analysis 
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
